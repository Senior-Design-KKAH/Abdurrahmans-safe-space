[env:cluster]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps = sandeepmistry/LoRa@0.8.0
build_flags =
    -I../link
; Cluster ESP32 MAC 58:2a:bd:7c:f0:a0 on this USB socket.
upload_port = /dev/serial/by-path/pci-0000:04:00.3-usb-0:1:1.0-port0
upload_speed = 115200
monitor_port = /dev/serial/by-path/pci-0000:04:00.3-usb-0:1:1.0-port0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
