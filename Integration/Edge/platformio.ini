[platformio]
src_dir = main

[env:edge]
platform = espressif32@6.13.0
board = esp32dev
framework = espidf
board_build.cmake_extra_args = -DEDGE_PLATFORMIO=ON
board_upload.flash_size = 2MB
; Sensing ESP32 MAC 20:50:0d:1b:90:04 on this USB socket.
upload_port = /dev/serial/by-path/pci-0000:04:00.3-usb-0:2:1.0-port0
upload_speed = 115200
monitor_port = /dev/serial/by-path/pci-0000:04:00.3-usb-0:2:1.0-port0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
